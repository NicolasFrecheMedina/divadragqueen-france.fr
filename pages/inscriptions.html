        <div class="page-inscription">


            <div class="inscription-image">
                <img src="../srv/banner-inscription.png" alt="Photo d'illustration">
                <a href="../index.html"><img src="../srv/logo/11.png" alt="Logo du site" class="logo"></a>
            </div>


            <div class="inscription-formulaire">
                <h3 class="inscription-titre">Inscription</h3>
                <form name="Inscription" class="form-inscription" method="POST" netlify-honeypot="bot-field" netlify>
                    <select name="region" class="input-region" required>
                        <option value="" disabled selected>Région représentée</option>
                        <option value="Auvergne-Rhône-Alpes">Auvergne-Rhône-Alpes</option>
                        <option value="Bourgogne-Franche-Comté">Bourgogne-Franche-Comté</option>
                        <option value="Bretagne">Bretagne</option>
                        <option value="Centre-Val de Loire">Centre-Val de Loire</option>
                        <option value="Grand Est">Grand Est</option>
                        <option value="Hauts-de-France">Hauts-de-France</option>
                        <option value="Île-de-France">Île-de-France</option>
                        <option value="Normandie">Normandie</option>
                        <option value="Nouvelle-Aquitaine">Nouvelle-Aquitaine</option>
                        <option value="Occitanie">Occitanie</option>
                        <option value="Pays de la Loire">Pays de la Loire</option>
                        <option value="Provence-Alpes-Côte d'Azur - Corse">Provence-Alpes-Côte d'Azur / Corse</option>
                        <option value="Outre-mer">Outre-mer</option>
                    </select>
                    <div class="row">
                        <input type="text" name="prenom" class="input-prenom" placeholder="Prénom" required>
                        <input type="text" name="nom" class="input-nom" placeholder="Nom" required>
                    </div>
                    <div class="line">
                        <input type="text" name="nom_drag" class="input-nom-drag" placeholder="Nom de Drag" required>
                    </div>
                    <div class="line">
                        <input type="text" name="adresse" class="input-adresse" placeholder="Adresse" required>
                    </div>
                    <div class="row">
                        <input type="text" name="code_postal" class="input-code-postal" placeholder="Code postal"
                            required>
                        <input type="text" name="commune" class="input-commune" placeholder="Commune" required>
                    </div>
                    <div class="row">
                        <input type="tel" name="telephone" class="input-telephone" placeholder="Téléphone" required>
                        <input type="email" name="email" class="input-email" placeholder="Email" required>
                    </div>
                    <div class="row">
                        <input type="date" name="date_naissance" class="input-date-naissance" required>
                        <input type="text" name="reseau_social" class="input-reseau-social"
                            placeholder="Réseau social (pseudo)" required>
                    </div>
                    <div class="line">
                        <textarea name="motivation" class="input-motivation" placeholder="Description / Motivation"
                            required></textarea>
                    </div>
                    <div class="accept-inscription-container">
                        <label class="checkbox-label">
                            <input type="checkbox" name="confidentialite" required>
                            <div>
                                J'accepte la <a href="./infos.html#politique-confidentialite">politique de confidentialité</a> du site Comité Miss Drag Queen
                                France.
                            </div>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="reglement" required>
                            <div>
                                J'accepte le <a href="./coucours.html">règlement du concours</a> et j'y adhère sans réserve.
                            </div>
                        </label>
                    </div>
                    <button type="submit" class="btn-valider">Valider</button>
                </form>
