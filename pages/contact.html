<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" type="image/png" href="../srv/logo/1.png" />
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
</head>


<body>
    <div class="background" id="bg-effect">
 

        <div class="page-inscription">


            <div class="contact-image" data-text="QUI SOMMES-NOUS ?">
                <img src="../srv/banner-contact.JPG" alt="Photo d'illustration" >
                <a href="../index.html"><img src="../srv/logo/11.png" alt="Logo du site" class="logo"></a>
            </div>


            <div class="inscription-formulaire">
                <h3 class="inscription-titre">Contactez <strong style="color: white;">nous</strong></h3>

                <form class="contact-form">
                    <div class="form-group">
                        <input type="text" class="form-input" id="contact-nom" name="nom" placeholder="Nom" required>
                    </div>
                    <div class="form-group">
                        <input type="text" class="form-input" id="contact-prenom" name="prenom" placeholder="Prénom" required>
                    </div>
                    <div class="form-group">
                        <input type="email" class="form-input" id="contact-email" name="email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="text" class="form-input" id="contact-objet" name="objet" placeholder="Objet de la demande" required>
                    </div>
                    <div class="form-group">
                        <textarea class="form-textarea" id="contact-message" name="message" placeholder="Votre message..." required></textarea>
                    </div>
                    <button type="submit" id="btn-envoyer" class="form-button">Envoyer</button>
                </form>

            </div>

        </div>

        <footer>
            <div class="footer-container">
                <div class="footer-links">
                    <a href="./infos.html" class="footer-link">CGU</a>
                    <div class="responsive-footer">|</div>
                    <a href="./infos.html" class="footer-link">MENTIONS LÉGALES</a>
                    <div class="responsive-footer">|</div>
                    <a href="./infos.html" class="footer-link">POLITIQUE DE CONFIDENTIALITÉ</a>
                    <div class="responsive-footer">|</div>
                    <a href="./inscriptions.html" class="footer-link">INSCRIPTION</a>
                    <div class="responsive-footer">|</div>
                    <a href="#" class="footer-link">CONTACT</a>
                </div>
                <div class="footer-social">
                    <span class="follow-us">FOLLOW US</span>
                    <!-- <a href="#" class="social-icon"><i class="fab fa-x-twitter"></i></a> -->
                    <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-facebook"></i></a>
                </div>
            </div>
            <div class="footer-copyright">
                © 2025 DIVA-DRAG-QUEEN-FRANCE. Tous droits réservés.
            </div>
        </footer>
    </div>

</body>
